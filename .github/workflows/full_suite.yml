name: AP-1 Runner Full Suite

on:
  push:
    branches: [main]
  # Pull requests to any base, so a PR stacked on another PR's branch is
  # checked too. "edited" covers a change of base (a stacked PR retargeted
  # to main): the jobs run again on the merge with the new base. Before
  # that, the checks on the head commit tested the merge with the old base.
  # A title or body edit also runs them: a job skipped by an "if" reports
  # success, even for a required check, so filtering those edits out could
  # turn a failed check green.
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Run full test suite
        run: python run_all_tests.py

      - name: Run unit tests
        run: python -m pytest
