name: AP-1 Runner Full Suite

on:
  push:
    branches: [main]
  # Pull requests to any base, so a PR stacked on another PR's branch is
  # checked too. "edited" covers a change of base (a stacked PR retargeted
  # to main), so the checks run again after it; until then they tested the
  # merge with the old base. What such a run checks out depends on when
  # GitHub has recomputed the PR's merge commit, so the guarantee that a PR
  # is checked against main as it is now is the ruleset's "require branches
  # to be up to date before merging". A title or body edit also runs them:
  # a job skipped by an "if" reports success, even for a required check, so
  # filtering those edits out could turn a failed check green.
  pull_request:
    types: [opened, synchronize, reopened, edited]

# One run per PR (or branch) at a time: a newer event cancels the older
# run, so a series of edits or pushes ends in one run of the latest state.
# A cancelled run reports "cancelled", which does not satisfy a required
# check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Run full test suite
        run: python run_all_tests.py

      - name: Run unit tests
        run: python -m pytest
