name: Regression Baseline

on:
  push:
    branches: [main]
  # Pull requests to any base, so a PR stacked on another PR's branch is
  # checked too. "edited" covers a change of base (a stacked PR retargeted
  # to main), so the checks run again after it; until then they tested the
  # merge with the old base. What such a run checks out depends on when
  # GitHub has recomputed the PR's merge commit, so the guarantee that a PR
  # is checked against main as it is now is the ruleset's "require branches
  # to be up to date before merging". A title or body edit also runs them:
  # a job skipped by an "if" reports success, even for a required check, so
  # filtering those edits out could turn a failed check green.
  pull_request:
    types: [opened, synchronize, reopened, edited]

# One run per PR (or branch) at a time: a newer event cancels the older
# run, so a series of edits or pushes ends in one run of the latest state.
# A cancelled run reports "cancelled", which does not satisfy a required
# check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: selftest.py recomputes the published
          # September source hash from the tag e7-quantise-fix.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -c tests/regression/constraints.txt -e .

      - name: Check the list of files the source hash covers
        run: python tests/regression/check_source_files.py

      - name: Test the harness's own checks
        run: python tests/regression/selftest.py

      - name: Run regression baseline
        shell: bash
        run: |
          log="$RUNNER_TEMP/regression.log"
          python tests/regression/run_regression.py 2>&1 | tee "$log"
          # The harness exits 0 when it runs no scenarios, so also require
          # the summary line to show at least one run and every run matching.
          summary=$(grep -E '^[0-9]+/[0-9]+ scenario runs match golden output' "$log" | tail -n 1 || true)
          if [[ "$summary" =~ ^([0-9]+)/([0-9]+)\  ]] \
              && (( BASH_REMATCH[2] >= 1 && BASH_REMATCH[1] == BASH_REMATCH[2] )); then
            echo "OK: $summary"
          else
            echo "::error::Regression summary missing, empty or failing: '$summary'"
            exit 1
          fi

      - name: Entry points use their own clone's src/
        run: python tests/regression/check_own_src.py

  retirement-map:
    # tests/legacy/RETIREMENT.md is built from the legacy suites and the
    # tests they map to; rebuild it and fail if the committed copy differs,
    # so a renamed or removed test cannot leave it stale. One OS and one
    # Python: the output does not depend on either.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -c tests/regression/constraints.txt -e .

      - name: Rebuild tests/legacy/RETIREMENT.md and fail on a diff
        shell: bash
        run: |
          PYTHONPATH=src python tests/legacy/retirement/build_retirement.py
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --porcelain
            git diff
            echo "::error::tests/legacy/RETIREMENT.md is stale (or the build changed other files); run tests/legacy/retirement/build_retirement.py and commit the result"
            exit 1
          fi
