name: Cross-Platform Hash Reproducibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hash-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify sealed hash
        run: python verify_hashes.py
