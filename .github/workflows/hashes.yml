name: Cross-Platform Hash Reproducibility

on:
  push:
    branches: [main]
  # Pull requests to any base, so a PR stacked on another PR's branch is
  # checked too, and arrives at main with these checks on its head commit.
  pull_request:

permissions:
  contents: read

jobs:
  hash-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e .

      - name: Verify sealed hash
        run: python tests/legacy/verify_hashes.py
