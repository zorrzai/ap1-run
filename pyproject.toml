[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ap1-run"
# Keep in step with the tag in VERSION, which is what the seal records.
version = "1.3.1"
description = "AP-1 runner instrument: executes and scores the AP-1 admissibility protocol against an OpenAI-compatible endpoint"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["requests"]

[project.optional-dependencies]
inspect = ["inspect-ai==0.3.255"]
dev = ["pytest>=8", "mutmut>=3.3", "coverage"]

[project.scripts]
ap1-run = "ap1_run.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The new tests: unit (tests/unit/), AP-1 clause and SPEC R4.1 conformance
# (tests/conformance/), multi-module behaviour (tests/functional/) and the
# Inspect wrapper (tests/inspect/, skipped unless inspect-ai is installed).
# The regression baseline runs separately, through
# tests/regression/run_regression.py. The original verify_*.py suites were
# retired in October 2026 (tests/RETIREMENT.md).
testpaths = ["tests/unit", "tests/conformance", "tests/functional", "tests/inspect"]
# Import the package from src/ even without an install.
pythonpath = ["src"]
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = [
    "req(*ids): the requirement IDs a test checks, e.g. @pytest.mark.req('R2.4')",
    "finding(*ids): the test concerns a known finding, e.g. @pytest.mark.finding('T3-2'). Without xfail it pins today's behaviour (the fix changes it); with xfail(strict=True) it states the correct behaviour (the fix removes the xfail)",
]
