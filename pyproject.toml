[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ap1-run"
# Keep in step with the tag in VERSION, which is what the seal records.
version = "1.3.1"
description = "AP-1 runner instrument: executes and scores the AP-1 admissibility protocol against an OpenAI-compatible endpoint"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["requests"]

[project.optional-dependencies]
inspect = ["inspect-ai==0.3.255"]
dev = ["pytest>=8", "mutmut>=3.3", "coverage"]

[project.scripts]
ap1-run = "ap1_run.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The new unit tests (tests/unit/). The legacy suites keep running through
# run_all_tests.py until they are retired, and the regression baseline
# through tests/regression/run_regression.py (CI: regression.yml).
testpaths = ["tests/unit"]
# Import the package from src/ even without an install.
pythonpath = ["src"]
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = [
    "req(*ids): the requirement IDs a test checks, e.g. @pytest.mark.req('R2.4')",
    "finding(*ids): pins today's behaviour for a known finding, e.g. @pytest.mark.finding('T3-2'); the fix changes the test",
]
