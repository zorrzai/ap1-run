[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ap1-run"
# Keep in step with the tag in VERSION, which is what the seal records.
version = "1.3.1"
description = "AP-1 runner instrument: executes and scores the AP-1 admissibility protocol against an OpenAI-compatible endpoint"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["requests"]

[project.optional-dependencies]
inspect = ["inspect-ai==0.3.255"]

[project.scripts]
ap1-run = "ap1_run.run:main"

[tool.setuptools.packages.find]
where = ["src"]
